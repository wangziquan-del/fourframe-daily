name: Deploy Four-Frame Daily

on:
  schedule:
    - cron: "0 3 * * *"    # 11:00 北京时间 (UTC+8)
    - cron: "0 6 * * *"    # 14:00 北京时间
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate four-frame daily page
        env:
          OUT_HTML: ${{ github.workspace }}/index.html
        run: python gen_fourframe_web.py
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html data.js _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
